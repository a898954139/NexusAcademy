<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nexus Trading Club — Private Trader Community</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(900px 500px at 70% 12%, oklch(0.80 0.13 85 / 0.06), transparent 70%);
  }
  .sub-hero {
    position: relative; z-index: 1;
    min-height: calc(100vh - 88px - 240px);
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: clamp(80px, 12vh, 160px) var(--pad-x);
  }
  .sub-hero__inner { max-width: 960px; display: flex; flex-direction: column; gap: 28px; align-items: center; }
  .sub-hero__label {
    display: inline-flex; align-items: center; gap: 14px;
    font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.3em;
    color: var(--gold); text-transform: uppercase;
  }
  .sub-hero__label::before, .sub-hero__label::after { content: ""; width: 28px; height: 1px; background: var(--gold-soft); }
  .sub-hero__title {
    font-family: var(--f-display);
    font-size: clamp(44px, 6.4vw, 84px); font-weight: 300;
    line-height: 1.06; letter-spacing: -0.02em; color: var(--ink);
    max-width: 22ch; margin: 0;
  }
  .sub-hero__title em { color: var(--gold); font-style: italic; font-weight: 400; }
  .sub-hero__sub {
    font-family: var(--f-ui); font-size: clamp(15px, 1.35vw, 18px);
    color: var(--ink-dim); max-width: 56ch; line-height: 1.65; margin: 0; font-weight: 300;
  }
  .sub-hero__back {
    display: inline-flex; align-items: center; gap: 10px; margin-top: 12px;
    font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--ink-soft);
    transition: color .3s, transform .3s; padding: 10px 0;
  }
  .sub-hero__back:hover { color: var(--gold); transform: translateX(-3px); }
  @media (max-width: 767px) {
    .sub-hero { padding: 64px var(--pad-x); min-height: calc(100vh - 72px - 220px); }
  }
</style>
</head>
<body>

<div id="site-header"></div>

<section class="sub-hero">
  <div class="sub-hero__inner">
    <div class="sub-hero__label" data-i18n="sub.label">Community Division</div>
    <h1 class="sub-hero__title" data-i18n-html="sub.title">Private Trader <em>Community</em></h1>
    <p class="sub-hero__sub" data-i18n="sub.subtitle">A disciplined community for structured market participation</p>
    <a href="Nexus Group.html" class="sub-hero__back" data-i18n="sub.back">← Return to Nexus Group</a>
  </div>
</section>

<div id="site-footer"></div>

<script src="shared.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', () => NexusShared.init({
  pageI18N: {
    EN: {
      'sub.label': 'Community Division',
      'sub.title': 'Private Trader <em>Community</em>',
      'sub.subtitle': 'A disciplined community for structured market participation',
      'sub.back': '← Return to Nexus Group',
    },
    BM: {
      'sub.label': 'Bahagian Komuniti',
      'sub.title': 'Komuniti Trader <em>Persendirian</em>',
      'sub.subtitle': 'Komuniti berdisiplin untuk penyertaan pasaran berstruktur',
      'sub.back': '← Kembali ke Nexus Group',
    },
    ID: {
      'sub.label': 'Divisi Komunitas',
      'sub.title': 'Komunitas Trader <em>Privat</em>',
      'sub.subtitle': 'Komunitas berdisiplin untuk partisipasi pasar terstruktur',
      'sub.back': '← Kembali ke Nexus Group',
    },
    '简': {
      'sub.label': '社群板块',
      'sub.title': '私密<em>交易者社群</em>',
      'sub.subtitle': '为结构化市场参与打造的纪律社群',
      'sub.back': '← 返回纽克斯集团',
    },
    '繁': {
      'sub.label': '社群板塊',
      'sub.title': '私密<em>交易者社群</em>',
      'sub.subtitle': '為結構化市場參與打造的紀律社群',
      'sub.back': '← 返回紐克斯集團',
    },
  }
}));
</script>

</body>
</html>
